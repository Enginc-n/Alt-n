name: Fikir turnuvası
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['test/turnuva.mjs', 'test/ideas/**']
jobs:
  turnuva:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node test/turnuva.mjs
